name: CI

# Every pull request, and every push to main.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request makes its older run pointless, so stop that one.
# Runs on main are left alone: every commit there should get a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A required status check would refer to this job by its name, `checks`.
  # Renaming it means updating that setting on GitHub too.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres beside the job, the same version as compose.yaml, so the
    # tests run against the database production will use -- not SQLite. It is
    # created empty for every run and thrown away afterwards.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wcf
          POSTGRES_PASSWORD: wcf
          POSTGRES_DB: wcf
        ports:
          - 5432:5432
        # The steps start only once this reports healthy.
        options: >-
          --health-cmd "pg_isready -U wcf -d wcf"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://wcf:wcf@127.0.0.1:5432/wcf
      # CI runs with DJANGO_DEBUG off, as production will, and then the settings
      # refuse to start without a key. This one guards nothing: the database
      # lives and dies with the job.
      DJANGO_SECRET_KEY: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        id: install
        run: pip install ".[dev]"

      # Each check below runs even if an earlier one failed, so a single run
      # reports every problem rather than stopping at the first. They are skipped
      # only when the install itself failed, since then they could not run at all.

      - name: Migrations apply to an empty database
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python manage.py migrate --no-input

      - name: Migrations match the models
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Fails when a model changed but nobody ran makemigrations.
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python manage.py check --fail-level WARNING

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Includes the leak test (TestNoAnswersBeforeTheReveal in
        # tests/test_game_views.py): no answer may reach the page or the API
        # before the player finishes.
        run: pytest

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # The github format turns findings into annotations on the PR's diff.
        run: ruff check --output-format=github .

      - name: Formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy

  # Builds the image and runs it the way a host would. On main it then pushes
  # that same image to GitHub's registry, ghcr.io, tagged with the commit, and
  # hands its digest to the deploy job.
  # Meant as a required check, like `checks`; the same note on renaming applies.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      # To push to ghcr.io. Only the push step, on main, uses it.
      packages: write

    # An empty database again. No ports: the app container joins this
    # database's network and finds it by its name, `postgres`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wcf
          POSTGRES_PASSWORD: wcf
          POSTGRES_DB: wcf
        options: >-
          --health-cmd "pg_isready -U wcf -d wcf"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # For the app container, not for this job's steps: each `docker run` passes
    # them in with -e. PORT isn't 8000, so a server that ignores it fails.
    env:
      DATABASE_URL: postgres://wcf:wcf@postgres:5432/wcf
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost
      PORT: "8080"

    steps:
      - uses: actions/checkout@v7

      - name: Name the image
        # ghcr.io/OWNER/REPO:COMMIT. Tagged with the full commit SHA, never
        # `latest`, so a tag always means one build. The registry wants the
        # name in lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build
        # The source label links the package on ghcr.io to this repository.
        run: >-
          docker build
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          --tag "$IMAGE" .

      - name: Migrate
        run: >-
          docker run --rm --network ${{ job.services.postgres.network }}
          -e DATABASE_URL -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS
          "$IMAGE" migrate

      - name: Serve
        # Through a published port, as a host reaches it. A server listening on
        # 127.0.0.1 inside the container would be unreachable here.
        run: >-
          docker run --detach --name app --network ${{ job.services.postgres.network }} --publish "$PORT:$PORT"
          -e PORT -e DATABASE_URL -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS
          "$IMAGE"

      - name: Smoke test
        run: |
          for _ in $(seq 30); do
            curl --fail --silent "localhost:$PORT/health" > /dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error "localhost:$PORT/health"
          curl --fail --silent --show-error "localhost:$PORT/ready"

          # The database has no puzzles, so the page says so, with a 404 -- which
          # still renders the real templates.
          status=$(curl --silent --output page.html --write-out '%{http_code}' "localhost:$PORT/")
          if [ "$status" != 404 ]; then
            echo "::error::Expected the page's 404 for no puzzle today, got $status"
            exit 1
          fi

          # The stylesheet it links, under its hashed name, served by WhiteNoise.
          css=$(grep --only-matching '/static/game/puzzle\.[0-9a-f]*\.css' page.html)
          curl --fail --silent --show-error --output /dev/null "localhost:$PORT$css"

      - name: Server logs
        if: ${{ failure() }}
        run: docker logs app

      - name: Push
        id: push
        # Main only. A pull request's image is built, tested and thrown away.
        if: ${{ github.event_name == 'push' }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

          # The digest names these exact bytes: a tag can be moved, a digest
          # can't. The deploy job goes by digest. Asked of the registry itself,
          # which knows the image only by the name it was pushed under.
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`${IMAGE%:*}@$digest\`" >> "$GITHUB_STEP_SUMMARY"

  # On main, once both checks pass, the image the `image` job just tested goes
  # to Cloud Run as a new revision with no traffic. It is smoke-tested at its own
  # URL and gets the traffic only if that passes; otherwise the previous revision
  # keeps serving and players never see the bad one.
  # Not a required check: it never runs on a pull request, so requiring it would
  # block every merge. Runs on main already queue one at a time (the
  # `concurrency` group above), so two deploys never overlap.
  deploy:
    needs: [checks, image]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To ask GitHub for an OIDC token, which Google trades for credentials that
      # last an hour. No key is stored anywhere, so there is none to leak.
      id-token: write

    env:
      PROJECT: which-came-first-512315
      REGION: europe-west1
      SERVICE: wcf
      # The URL a revision tagged `candidate` gets of its own, traffic or not.
      CANDIDATE_URL: https://candidate---wcf-801031466819.europe-west1.run.app

    steps:
      - uses: google-github-actions/auth@v3
        with:
          # The provider admits tokens from this repository's main branch only.
          workload_identity_provider: projects/801031466819/locations/global/workloadIdentityPools/github/providers/which-came-first
          # Can deploy revisions and move traffic, and nothing else.
          service_account: wcf-deploy@which-came-first-512315.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy without traffic
        # Through the `ghcr` remote repository in Artifact Registry, by digest.
        # Only the image changes: the service account, secrets and settings
        # carry over from the current revision.
        run: >-
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION"
          --image="$REGION-docker.pkg.dev/$PROJECT/ghcr/${GITHUB_REPOSITORY,,}@${{ needs.image.outputs.digest }}"
          --no-traffic --tag=candidate

      - name: Smoke test
        # GET requests only, which never write to the database, so this is safe
        # against production on every deploy. The retries ride out a cold start.
        run: |
          curl --fail --silent --show-error --retry 3 "$CANDIDATE_URL/health"
          curl --fail --silent --show-error --retry 3 "$CANDIDATE_URL/ready"

          # Today's puzzle, or "no puzzle today" if none was generated: both
          # render the real templates.
          status=$(curl --silent --show-error --retry 3 --output page.html --write-out '%{http_code}' "$CANDIDATE_URL/")
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then
            echo "::error::Expected the puzzle page (200) or no puzzle today (404), got $status"
            exit 1
          fi

          css=$(grep --only-matching '/static/game/puzzle\.[0-9a-f]*\.css' page.html)
          curl --fail --silent --show-error --retry 3 --output /dev/null "$CANDIDATE_URL$css"

      - name: Move the traffic
        run: >-
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT" --region="$REGION"
          --to-tags=candidate=100
