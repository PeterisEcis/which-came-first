[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "which-came-first"
version = "0.1.0"
description = "A daily \"which came first?\" game built from Wikipedia's On this day feed."
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-stubs-ext>=6.1",
    "dj-database-url>=3.1",
    "psycopg[binary]>=3.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=6.1",
    "types-requests",
]

[tool.setuptools.packages.find]
# Flat layout rather than src/: Django keeps its project (config/) and apps
# (game/) at the root next to manage.py, and the generator sits beside them.
include = ["puzzle_generator*", "game*", "config*"]

[tool.setuptools.package-data]
game = ["templates/game/*.html", "static/game/*"]

[tool.ruff]
line-length = 100
src = [".", "tests"]
target-version = "py313"
# Generated by `makemigrations`; reviewed, not hand-formatted.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplification
    "DJ",   # Django
    "RUF",
]

[tool.mypy]
python_version = "3.13"
files = ["puzzle_generator", "game", "config"]
exclude = ["/migrations/"]
strict = true
warn_unused_ignores = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
